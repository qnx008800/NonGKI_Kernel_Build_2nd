name: Build Kernel for Redmi 10X 5G (atom) MIUI 13

on:
  workflow_call:
  workflow_dispatch:

env:
  # ========== 设备信息 ==========
  DEVICE_NAME : "Redmi 10X 5G"
  DEVICE_CODENAME : "atom"

  # ========== 编译器配置 ==========
  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1"

  # ========== 内核源码 ==========
  KERNEL_SOURCE : "https://github.com/XayahSuSuSu/kernel_redmi_mt6885"
  KERNEL_BRANCH : "main"

  # ========== Clang ==========
  # Proton Clang (较新，兼容性好)
  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang"
  CLANG_BRANCH : "master"

  # ========== GCC ==========
  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"
  GCC_64_BRANCH : "master"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9"
  GCC_32_BRANCH : "master"

  # ========== Defconfig ==========
  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "cezanne_user_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # ========== KernelSU (原版) ==========
  # 关闭自动获取，手动指定原版 KernelSU
  KERNELSU_SOURCE : "https://github.com/tiann/KernelSU"
  KERNELSU_BRANCH : "main"
  KERNELSU_AUTO_GET : "false"
  KERNELSU_AUTO_FORK : ""

  # ========== SUSFS ==========
  SUSFS_ENABLE : "true"
  SUSFS_FIXED : "true"

  # ========== AnyKernel3 ==========
  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  # ========== Boot 镜像 ==========
  # ⚠️ 重要：上传 boot.img 到仓库后，在这里填写 raw 地址
  # 例如: "https://raw.githubusercontent.com/qnx008800/NonGKI_Kernel_Build_2nd/main/boot.img"
  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "MIUI_13.0.8"

  # ========== 其他配置 ==========
  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "main"

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  # ========== Hook 方式 ==========
  # syscall: 最小化修补，隐藏性更好，适合 4.14
  # normal: 标准手动修补，兼容性更好
  HOOK_METHOD: "syscall"

  # 4.14 > 4.9，不需要 kernel_read/kernel_write 补丁
  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "mediatek"

  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # Atom/MT6875 specific options if needed
          # echo "CONFIG_MTK_PLATFORM=mt6875" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}

      - name: Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: Build Process
        uses: ./.github/workflows/build-process

      - name: Pack Process
        uses: ./.github/workflows/pack-process

      - name: Upload Artifacts
        uses: ./.github/workflows/upload-files
